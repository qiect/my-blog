<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680"
     font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="y2024" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="y2025" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="y2026" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="44" font-size="26" font-weight="800" fill="#047857"
        text-anchor="middle">近年论文真题分析时间线</text>
  <text x="600" y="70" font-size="13" fill="#047857" opacity="0.7"
        text-anchor="middle">2024 - 2026 论文真题出题规律与应对策略 · 趋势从单一领域到跨领域综合</text>

  <!-- ===== Horizontal timeline ===== -->
  <!-- Timeline axis -->
  <line x1="80" y1="350" x2="1120" y2="350" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
  <!-- Timeline dots -->
  <circle cx="220" cy="350" r="14" fill="#34D399" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="560" cy="350" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="900" cy="350" r="14" fill="#059669" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Year labels on timeline -->
  <text x="220" y="384" font-size="18" font-weight="800" fill="#047857" text-anchor="middle">2024</text>
  <text x="560" y="384" font-size="18" font-weight="800" fill="#047857" text-anchor="middle">2025</text>
  <text x="900" y="384" font-size="18" font-weight="800" fill="#047857" text-anchor="middle">2026</text>

  <!-- ===== 2024 card (top) ===== -->
  <g transform="translate(60, 100)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <rect width="320" height="40" rx="14" fill="url(#y2024)"/>
    <rect y="28" width="320" height="12" fill="url(#y2024)"/>
    <text x="160" y="27" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2024 年论文真题</text>

    <text x="16" y="62" font-size="12" font-weight="700" fill="#047857">上半年</text>
    <rect x="16" y="70" width="288" height="30" rx="5" fill="#ECFDF5"/>
    <text x="24" y="89" font-size="11" fill="#6B7280">论项目的质量管理</text>

    <text x="16" y="118" font-size="12" font-weight="700" fill="#047857">下半年</text>
    <rect x="16" y="126" width="288" height="30" rx="5" fill="#ECFDF5"/>
    <text x="24" y="145" font-size="11" fill="#6B7280">论项目的风险管理</text>

    <line x1="16" y1="170" x2="304" y2="170" stroke="#D1FAE5" stroke-width="1"/>
    <text x="16" y="188" font-size="11" font-weight="700" fill="#059669">出题特征</text>
    <text x="16" y="206" font-size="10.5" fill="#6B7280">单一领域为主，经典题型</text>
    <text x="16" y="220" font-size="10.5" fill="#6B7280">要求理论 + 实践结合论述</text>
  </g>
  <!-- Connector to timeline -->
  <line x1="220" y1="330" x2="220" y2="350" stroke="#34D399" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- ===== 2025 card (top) ===== -->
  <g transform="translate(400, 100)" filter="url(#cardShadow)">
    <rect width="320" height="230" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <rect width="320" height="40" rx="14" fill="url(#y2025)"/>
    <rect y="28" width="320" height="12" fill="url(#y2025)"/>
    <text x="160" y="27" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2025 年论文真题</text>

    <text x="16" y="62" font-size="12" font-weight="700" fill="#047857">上半年</text>
    <rect x="16" y="70" width="288" height="30" rx="5" fill="#ECFDF5"/>
    <text x="24" y="89" font-size="11" fill="#6B7280">论项目的质量与风险管理（跨领域）</text>

    <text x="16" y="118" font-size="12" font-weight="700" fill="#047857">下半年</text>
    <rect x="16" y="126" width="288" height="30" rx="5" fill="#ECFDF5"/>
    <text x="24" y="145" font-size="11" fill="#6B7280">论项目的沟通与干系人管理</text>

    <line x1="16" y1="170" x2="304" y2="170" stroke="#D1FAE5" stroke-width="1"/>
    <text x="16" y="188" font-size="11" font-weight="700" fill="#059669">出题特征</text>
    <text x="16" y="206" font-size="10.5" fill="#6B7280">跨领域综合出题成为新趋势</text>
    <text x="16" y="220" font-size="10.5" fill="#6B7280">要求论述领域间关联与协同</text>
  </g>
  <line x1="560" y1="330" x2="560" y2="350" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- ===== 2026 card (top) ===== -->
  <g transform="translate(740, 100)" filter="url(#cardShadow)">
    <rect width="400" height="230" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <rect width="400" height="40" rx="14" fill="url(#y2026)"/>
    <rect y="28" width="400" height="12" fill="url(#y2026)"/>
    <text x="200" y="27" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2026 年论文真题（预测）</text>

    <text x="16" y="62" font-size="12" font-weight="700" fill="#047857">上半年</text>
    <rect x="16" y="70" width="368" height="30" rx="5" fill="#ECFDF5"/>
    <text x="24" y="89" font-size="11" fill="#6B7280">论项目的采购与合同管理（结合数字化转型）</text>

    <text x="16" y="118" font-size="12" font-weight="700" fill="#047857">下半年（预测）</text>
    <rect x="16" y="126" width="368" height="30" rx="5" fill="#ECFDF5"/>
    <text x="24" y="145" font-size="11" fill="#6B7280">论项目的进度与成本管理（结合云原生）</text>

    <line x1="16" y1="170" x2="384" y2="170" stroke="#D1FAE5" stroke-width="1"/>
    <text x="16" y="188" font-size="11" font-weight="700" fill="#059669">出题特征</text>
    <text x="16" y="206" font-size="10.5" fill="#6B7280">跨领域 + 结合新技术场景</text>
    <text x="16" y="220" font-size="10.5" fill="#6B7280">反模板化，强调真实项目实践</text>
  </g>
  <line x1="900" y1="330" x2="900" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- ===== Bottom: Strategy summary ===== -->
  <g transform="translate(60, 420)" filter="url(#cardShadow)">
    <rect width="1080" height="230" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <rect width="1080" height="40" rx="14" fill="url(#y2026)"/>
    <rect y="28" width="1080" height="12" fill="url(#y2026)"/>
    <text x="540" y="27" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">应对策略：三个趋势三条对策</text>

    <!-- Strategy 1 -->
    <g transform="translate(20, 56)">
      <rect width="330" height="160" rx="10" fill="#F0FDF4" stroke="#D1FAE5" stroke-width="1"/>
      <rect x="0" y="0" width="330" height="30" rx="10" fill="#ECFDF5"/>
      <rect x="0" y="18" width="330" height="12" fill="#ECFDF5"/>
      <text x="12" y="21" font-size="12" font-weight="800" fill="#047857">趋势一：跨领域综合</text>
      <text x="12" y="52" font-size="11" font-weight="700" fill="#059669">对策：准备 4 组关联框架</text>
      <rect x="12" y="60" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="68" font-size="11" fill="#6B7280">质量 + 风险（缺陷即风险源）</text>
      <rect x="12" y="78" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="86" font-size="11" fill="#6B7280">进度 + 成本（进度影响成本）</text>
      <rect x="12" y="96" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="104" font-size="11" fill="#6B7280">沟通 + 干系人（双向影响）</text>
      <rect x="12" y="114" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="122" font-size="11" fill="#6B7280">采购 + 合同（采购依赖合同）</text>
      <text x="12" y="146" font-size="10.5" fill="#059669" font-weight="700">每组分领域论述 + 关联点论述</text>
    </g>

    <!-- Strategy 2 -->
    <g transform="translate(370, 56)">
      <rect width="330" height="160" rx="10" fill="#F0FDF4" stroke="#D1FAE5" stroke-width="1"/>
      <rect x="0" y="0" width="330" height="30" rx="10" fill="#ECFDF5"/>
      <rect x="0" y="18" width="330" height="12" fill="#ECFDF5"/>
      <text x="12" y="21" font-size="12" font-weight="800" fill="#047857">趋势二：反模板化</text>
      <text x="12" y="52" font-size="11" font-weight="700" fill="#059669">对策：个性化血肉</text>
      <rect x="12" y="60" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="68" font-size="11" fill="#6B7280">准备 2 个真实项目（传统+数字）</text>
      <rect x="12" y="78" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="86" font-size="11" fill="#6B7280">每项目 3-4 个实践案例</text>
      <rect x="12" y="96" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="104" font-size="11" fill="#6B7280">案例要有具体数据</text>
      <rect x="12" y="114" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="122" font-size="11" fill="#6B7280">万能句式搭骨架不填全文</text>
      <text x="12" y="146" font-size="10.5" fill="#059669" font-weight="700">模板提供结构，案例提供差异</text>
    </g>

    <!-- Strategy 3 -->
    <g transform="translate(720, 56)">
      <rect width="340" height="160" rx="10" fill="#F0FDF4" stroke="#D1FAE5" stroke-width="1"/>
      <rect x="0" y="0" width="340" height="30" rx="10" fill="#ECFDF5"/>
      <rect x="0" y="18" width="340" height="12" fill="#ECFDF5"/>
      <text x="12" y="21" font-size="12" font-weight="800" fill="#047857">趋势三：结合新技术场景</text>
      <text x="12" y="52" font-size="11" font-weight="700" fill="#059669">对策：数字化转型项目</text>
      <rect x="12" y="60" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="68" font-size="11" fill="#6B7280">微服务/云原生架构改造</text>
      <rect x="12" y="78" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="86" font-size="11" fill="#6B7280">数据中台/数据治理建设</text>
      <rect x="12" y="96" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="104" font-size="11" fill="#6B7280">AI 平台/大模型落地</text>
      <rect x="12" y="114" width="6" height="6" rx="3" fill="#059669"/>
      <text x="24" y="122" font-size="11" fill="#6B7280">政务云/智慧城市平台</text>
      <text x="12" y="146" font-size="10.5" fill="#059669" font-weight="700">项目背景要体现时代性</text>
    </g>
  </g>

  <!-- Bottom note -->
  <text x="600" y="672" font-size="12" fill="#059669" text-anchor="middle" opacity="0.8">
    数据来源：近三年软考高项论文真题分析 · 2026 年下半年为趋势预测 · 以官方大纲为准
  </text>
</svg>