<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680"
     font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="44" font-size="26" font-weight="800" fill="#047857"
        text-anchor="middle">论文素材组装流程</text>
  <text x="600" y="70" font-size="13" fill="#047857" opacity="0.7"
        text-anchor="middle">考题分析 -&gt; 选素材 -&gt; 拼骨架 -&gt; 填血肉 -&gt; 润色 · 120 分钟成文</text>

  <!-- ===== 5-step horizontal flow ===== -->
  <!-- Step 1: 考题分析 -->
  <g transform="translate(40, 110)" filter="url(#cardShadow)">
    <rect width="210" height="130" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <rect width="210" height="40" rx="14" fill="url(#stepGrad)"/>
    <rect y="28" width="210" height="12" fill="url(#stepGrad)"/>
    <circle cx="28" cy="20" r="14" fill="#FFFFFF"/>
    <text x="28" y="26" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">1</text>
    <text x="60" y="26" font-size="15" font-weight="800" fill="#FFFFFF">考题分析</text>
    <text x="16" y="64" font-size="11" font-weight="700" fill="#047857">5 分钟</text>
    <text x="16" y="82" font-size="11" fill="#6B7280">识别考哪个/哪几个领域</text>
    <text x="16" y="98" font-size="11" fill="#6B7280">圈出题目关键词</text>
    <text x="16" y="114" font-size="11" fill="#6B7280">判断是否跨领域</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="250" y1="175" x2="270" y2="175" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Step 2: 选素材 -->
  <g transform="translate(270, 110)" filter="url(#cardShadow)">
    <rect width="210" height="130" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <rect width="210" height="40" rx="14" fill="url(#stepGrad2)"/>
    <rect y="28" width="210" height="12" fill="url(#stepGrad2)"/>
    <circle cx="28" cy="20" r="14" fill="#FFFFFF"/>
    <text x="28" y="26" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">2</text>
    <text x="60" y="26" font-size="15" font-weight="800" fill="#FFFFFF">选素材</text>
    <text x="16" y="64" font-size="11" font-weight="700" fill="#047857">10 分钟</text>
    <text x="16" y="82" font-size="11" fill="#6B7280">从素材库取对应卡片</text>
    <text x="16" y="98" font-size="11" fill="#6B7280">调出万能项目背景</text>
    <text x="16" y="114" font-size="11" fill="#6B7280">匹配万能句式模板</text>
  </g>

  <line x1="480" y1="175" x2="500" y2="175" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Step 3: 拼骨架 -->
  <g transform="translate(500, 110)" filter="url(#cardShadow)">
    <rect width="210" height="130" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <rect width="210" height="40" rx="14" fill="url(#stepGrad)"/>
    <rect y="28" width="210" height="12" fill="url(#stepGrad)"/>
    <circle cx="28" cy="20" r="14" fill="#FFFFFF"/>
    <text x="28" y="26" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">3</text>
    <text x="60" y="26" font-size="15" font-weight="800" fill="#FFFFFF">拼骨架</text>
    <text x="16" y="64" font-size="11" font-weight="700" fill="#047857">15 分钟</text>
    <text x="16" y="82" font-size="11" fill="#6B7280">五段式搭框架</text>
    <text x="16" y="98" font-size="11" fill="#6B7280">填入万能句式</text>
    <text x="16" y="114" font-size="11" fill="#6B7280">标注需填充位置</text>
  </g>

  <line x1="710" y1="175" x2="730" y2="175" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Step 4: 填血肉 -->
  <g transform="translate(730, 110)" filter="url(#cardShadow)">
    <rect width="210" height="130" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <rect width="210" height="40" rx="14" fill="url(#stepGrad2)"/>
    <rect y="28" width="210" height="12" fill="url(#stepGrad2)"/>
    <circle cx="28" cy="20" r="14" fill="#FFFFFF"/>
    <text x="28" y="26" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">4</text>
    <text x="60" y="26" font-size="15" font-weight="800" fill="#FFFFFF">填血肉</text>
    <text x="16" y="64" font-size="11" font-weight="700" fill="#047857">70 分钟</text>
    <text x="16" y="82" font-size="11" fill="#6B7280">写入实践细节</text>
    <text x="16" y="98" font-size="11" fill="#6B7280">补充量化数据</text>
    <text x="16" y="114" font-size="11" fill="#6B7280">确保理论实践衔接</text>
  </g>

  <line x1="940" y1="175" x2="960" y2="175" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Step 5: 润色定稿 -->
  <g transform="translate(960, 110)" filter="url(#cardShadow)">
    <rect width="200" height="130" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <rect width="200" height="40" rx="14" fill="url(#stepGrad)"/>
    <rect y="28" width="200" height="12" fill="url(#stepGrad)"/>
    <circle cx="28" cy="20" r="14" fill="#FFFFFF"/>
    <text x="28" y="26" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">5</text>
    <text x="60" y="26" font-size="15" font-weight="800" fill="#FFFFFF">润色定稿</text>
    <text x="16" y="64" font-size="11" font-weight="700" fill="#047857">20 分钟</text>
    <text x="16" y="82" font-size="11" fill="#6B7280">检查字数达标</text>
    <text x="16" y="98" font-size="11" fill="#6B7280">核对过程名准确</text>
    <text x="16" y="114" font-size="11" fill="#6B7280">时间轴留 10 分钟</text>
  </g>

  <!-- ===== Bottom: Detailed assembly example ===== -->
  <g transform="translate(40, 280)" filter="url(#softShadow)">
    <rect width="1120" height="370" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
    <rect width="1120" height="44" rx="16" fill="url(#outGrad)"/>
    <rect y="32" width="1120" height="12" fill="url(#outGrad)"/>
    <text x="560" y="30" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">组装示例：考题"论项目的质量管理"</text>

    <!-- Left column: 素材库 -->
    <g transform="translate(20, 60)">
      <text x="0" y="14" font-size="13" font-weight="800" fill="#047857">从素材库提取</text>
      <rect x="0" y="22" width="340" height="36" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
      <text x="10" y="44" font-size="11" fill="#047857">[项目背景] 智慧政务云平台 3200 万</text>
      <rect x="0" y="64" width="340" height="36" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
      <text x="10" y="86" font-size="11" fill="#047857">[理论] 规划质量-质量保证-控制质量</text>
      <rect x="0" y="106" width="340" height="36" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
      <text x="10" y="128" font-size="11" fill="#047857">[实践] 86 条数据稽核规则，偏差率降至2%</text>
      <rect x="0" y="148" width="340" height="36" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
      <text x="10" y="170" font-size="11" fill="#047857">[句式] "在XX管理中，我开展了以下实践..."</text>
      <rect x="0" y="190" width="340" height="36" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
      <text x="10" y="212" font-size="11" fill="#047857">[数据] 缺陷密度 3.2 -&gt; 0.8，满意度 92%</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(380, 160)">
      <text x="30" y="-10" font-size="12" font-weight="800" fill="#059669" text-anchor="middle">组装</text>
      <line x1="0" y1="0" x2="50" y2="0" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
    </g>

    <!-- Right column: 成文 -->
    <g transform="translate(450, 60)">
      <text x="0" y="14" font-size="13" font-weight="800" fill="#047857">拼装成文（节选）</text>
      <rect x="0" y="22" width="650" height="300" rx="8" fill="#F0FDF4" stroke="#34D399" stroke-width="1"/>

      <text x="14" y="42" font-size="10.5" font-weight="800" fill="#047857">[摘要]</text>
      <text x="56" y="42" font-size="10.5" fill="#6B7280">2025年3月，我所在公司承建某市智慧政务云平台，投资3200万...</text>

      <text x="14" y="62" font-size="10.5" font-weight="800" fill="#047857">[理论]</text>
      <text x="56" y="62" font-size="10.5" fill="#6B7280">项目质量管理包括规划质量、实施质量保证和控制质量三个过程。规划</text>
      <text x="56" y="76" font-size="10.5" fill="#6B7280">质量是识别质量标准并制定计划；质量保证是过程层面的审计；控制</text>
      <text x="56" y="90" font-size="10.5" fill="#6B7280">质量是结果层面的检查。</text>

      <text x="14" y="114" font-size="10.5" font-weight="800" fill="#047857">[实践]</text>
      <text x="56" y="114" font-size="10.5" fill="#059669" font-weight="700">在掌握上述理论的基础上，我在本项目中有针对性地开展了</text>
      <text x="56" y="128" font-size="10.5" fill="#059669" font-weight="700">以下质量管理实践工作：</text>
      <text x="56" y="146" font-size="10.5" fill="#6B7280">1. 制定质量管理计划，明确数据质量标准...</text>
      <text x="56" y="162" font-size="10.5" fill="#6B7280">2. 建立86条数据质量稽核规则，自动化校验</text>
      <text x="56" y="178" font-size="10.5" fill="#6B7280">3. 缺陷密度从3.2降至0.8，偏差率降至2%以内</text>

      <text x="14" y="204" font-size="10.5" font-weight="800" fill="#047857">[结尾]</text>
      <text x="56" y="204" font-size="10.5" fill="#6B7280">通过本项目实践，我深刻认识到质量管理在项目成功中的关键作用...</text>

      <rect x="14" y="226" width="622" height="56" rx="6" fill="#ECFDF5"/>
      <text x="26" y="246" font-size="11" font-weight="800" fill="#047857">组装效果</text>
      <text x="26" y="264" font-size="10.5" fill="#6B7280">理论准确 + 实践真实 + 数据量化 = 结构完整、得分点齐全</text>
      <text x="26" y="278" font-size="10.5" fill="#6B7280">总字数约 2600 字，用时约 110 分钟</text>
    </g>
  </g>
</svg>